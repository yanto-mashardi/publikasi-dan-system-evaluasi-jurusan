publication_policy:
  default_visibility: INTERNAL

  rules:
    STRATEGIC_STATEMENT:
      requires_status: EFFECTIVE
      requires_approval: true
      public_fields:
        - statement_type
        - statement
        - version_number
        - effective_from

    KPI_MEASUREMENT:
      requires_status: APPROVED
      requires_approval: true
      public_fields:
        - indicator_name
        - period
        - target_value
        - actual_value
        - achievement_percent
        - status
        - public_summary

    EVALUATION:
      requires_status: APPROVED
      requires_approval: true
      public_fields:
        - subject_type
        - period
        - public_summary
        - followup_progress

  always_private:
    - personal_data
    - raw_audit_notes
    - reviewer_identity
    - respondent_identity
    - private_evidence
    - credentials
