name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: evaluasi_jurusan
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/evaluasi_jurusan
      AUTH_SECRET: ci-auth-secret-at-least-thirty-two-characters-long
      BOOTSTRAP_ADMIN_NAME: CI Administrator
      BOOTSTRAP_ADMIN_EMAIL: ci-admin@example.ac.id
      BOOTSTRAP_ADMIN_PASSWORD: ci-password-12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npx tsc --noEmit
      - name: Push database schema
        run: npm run db:push
      - name: Seed foundation
        run: npm run db:seed
      - name: Bootstrap CI administrator
        run: npm run bootstrap:admin
      - name: Build
        run: npm run build
      - name: Runtime smoke test
        run: |
          npm start > /tmp/upps-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          curl -fsS http://127.0.0.1:3000/ > /dev/null
          curl -fsS http://127.0.0.1:3000/akademik > /dev/null
          curl -fsS http://127.0.0.1:3000/laboratorium > /dev/null
          curl -fsS http://127.0.0.1:3000/riset-pkm > /dev/null
          curl -fsS http://127.0.0.1:3000/mahasiswa-lulusan > /dev/null
          curl -fsS http://127.0.0.1:3000/kerja-sama > /dev/null
          curl -fsS http://127.0.0.1:3000/internal/login > /dev/null
          curl -fsS -c /tmp/cookies.txt -o /dev/null -X POST \
            -d 'email=ci-admin@example.ac.id&password=ci-password-12345' \
            http://127.0.0.1:3000/api/auth/login
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:3000/internal > /dev/null
          curl -fsS -b /tmp/cookies.txt http://127.0.0.1:3000/internal/resources > /dev/null
          curl -fsS -b /tmp/cookies.txt -H 'content-type: application/json' \
            -d '{"organizationId":1,"code":"CI-LAB","name":"CI Laboratory","description":"Runtime smoke test","location":"CI"}' \
            http://127.0.0.1:3000/api/internal/laboratories > /tmp/lab.json
          cat /tmp/lab.json
      - name: Publish commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then STATE=success; else STATE=failure; fi
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"$STATE\",\"target_url\":\"$RUN_URL\",\"description\":\"MySQL + TypeScript + build + runtime smoke\",\"context\":\"upps-ci/build\"}"
